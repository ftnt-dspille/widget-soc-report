<form data-ng-submit="save()" class="noMargin" name="editSocreportForm" novalidate>
    <div class="modal-header">
        <h3 class="modal-title col-md-9">Edit SOC Report Widget</h3>
        <button type="button" class="close" data-ng-click="cancel()" data-dismiss="modal" aria-label="Close"
                id="closeEditSocreportForm">
            <div aria-hidden="true" class="version-button">+</div>
        </button>
    </div>
    <div class="modal-body">
        <div class="typehead-field" name="htmlReportForm">
            <h8>Displays HTML content from a JSON or text field in the record</h8>

            <div class="form-group dashed-border-section" style="position:relative;">
                <div style="padding: 12px;">
                    <div class="row margin-bottom-sm">
                        <div class="col-md-8">
                            <div class="form-group margin-bottom-0"
                                 data-ng-class="{ 'has-error': editSocreportForm.title.$invalid && editSocreportForm.title.$touched }">
                                <label for="title" class="control-label margin-top-sm">Widget Title<span
                                        class="text-danger">*</span></label>
                                <input id="title" name="title" type="text" class="form-control"
                                       data-ng-model="config.title" required placeholder="Enter widget title">
                                <div data-cs-messages="editSocreportForm.title"></div>
                            </div>
                        </div>
                    </div>

                    <div class="row margin-bottom-sm">
                        <div class="col-md-8">
                            <div class="form-group margin-bottom-0"
                                 data-ng-class="{ 'has-error': editSocreportForm.selectedField.$invalid && editSocreportForm.selectedField.$touched }">
                                <label for="selectedField" class="control-label margin-top-sm">Data Source Field<span
                                        class="text-danger">*</span></label>
                                <span data-uib-tooltip="Select the field that contains the JSON data or HTML content to display"
                                      data-tooltip-append-to-body="true">
                                    <i class="margin-left-sm icon icon-information font-Size-13"></i>
                                </span>
                                <div class="cs-select">
                                    <select name="selectedField" id="selectedField" class="form-control"
                                            data-ng-model="config.selectedField"
                                            data-ng-options="field.name as (field.title + ' (' + field.type + ')') for field in fields"
                                            required>
                                        <option value="">Select a field</option>
                                    </select>
                                    <span class="fa fa-sort-desc"></span>
                                </div>
                                <div data-cs-messages="editSocreportForm.selectedField"></div>
                            </div>
                        </div>
                    </div>

                    <div class="row margin-bottom-sm">
                        <div class="col-md-8">
                            <div class="form-group margin-bottom-0"
                                 data-ng-class="{ 'has-error': editSocreportForm.changeNumberField.$invalid && editSocreportForm.changeNumberField.$touched }">
                                <label for="changeNumberField" class="control-label margin-top-sm">Change Number
                                    Field<span
                                            class="text-danger">*</span></label>
                                <span data-uib-tooltip="Select the field that contains the change number to filter by (e.g., CHG0123456)"
                                      data-tooltip-append-to-body="true">
                <i class="margin-left-sm icon icon-information font-Size-13"></i>
            </span>
                                <div class="cs-select">
                                    <select name="changeNumberField" id="changeNumberField" class="form-control"
                                            data-ng-model="config.changeNumberField"
                                            data-ng-options="field.name as (field.title + ' (' + field.type + ')') for field in changeNumberFields"
                                            required>
                                        <option value="">Select change number field</option>
                                    </select>
                                    <span class="fa fa-sort-desc"></span>
                                </div>
                                <div data-cs-messages="editSocreportForm.changeNumberField"></div>
                                <small class="text-muted">This field should contain the change number to search for in
                                    device revisions</small>
                            </div>
                        </div>
                    </div>

                    <div class="row margin-bottom-sm" data-ng-if="fields.length === 0">
                        <div class="col-md-12">
                            <div class="alert alert-warning">
                                <i class="icon icon-warning margin-right-sm"></i>
                                No text or textarea fields available. This widget must be configured from a record
                                detail page.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button id="edit-widget-save" type="submit" class="btn btn-sm btn-primary">
            <i class="icon icon-check margin-right-sm"></i>Save
        </button>
        <button id="edit-widget-cancel" type="button" class="btn btn-sm btn-default" data-ng-click="cancel()">
            <i class="icon icon-close margin-right-sm"></i>Close
        </button>
    </div>
</form>
